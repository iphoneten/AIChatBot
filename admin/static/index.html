<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>aiChatBot 管理后台</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
         background: #f5f6f8; color: #2c3e50; min-height: 100vh; }
  header { background: #1f2937; color: #fff; padding: 14px 24px;
           display: flex; justify-content: space-between; align-items: center; }
  header h1 { font-size: 18px; font-weight: 600; }
  header button { background: transparent; border: 1px solid #4b5563; color: #d1d5db;
                  padding: 6px 14px; border-radius: 6px; cursor: pointer; }
  main { max-width: 960px; margin: 24px auto; padding: 0 16px; }
  .cards { display: flex; gap: 16px; margin-bottom: 24px; flex-wrap: wrap; }
  .card { background: #fff; border-radius: 10px; padding: 20px 24px; flex: 1; min-width: 160px;
          box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .card .num { font-size: 28px; font-weight: 700; color: #2563eb; }
  .card .label { font-size: 13px; color: #6b7280; margin-top: 4px; }
  section { background: #fff; border-radius: 10px; padding: 20px 24px; margin-bottom: 24px;
            box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  section h2 { font-size: 15px; margin-bottom: 12px; color: #374151; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid #f0f1f3; }
  th { color: #9ca3af; font-weight: 500; }
  /* 登录 */
  #login-view { display: flex; justify-content: center; align-items: center; min-height: 80vh; }
  .login-box { background: #fff; padding: 36px 40px; border-radius: 12px; width: 340px;
               box-shadow: 0 4px 16px rgba(0,0,0,.1); }
  .login-box h2 { text-align: center; margin-bottom: 22px; }
  .login-box input { width: 100%; padding: 10px 12px; margin-bottom: 14px; border: 1px solid #d1d5db;
                     border-radius: 6px; font-size: 14px; }
  .login-box button { width: 100%; padding: 10px; background: #2563eb; color: #fff; border: none;
                      border-radius: 6px; font-size: 14px; cursor: pointer; }
  .login-box button:hover { background: #1d4ed8; }
  #err { color: #dc2626; font-size: 13px; margin-bottom: 10px; min-height: 18px; text-align: center; }
  .hidden { display: none !important; }
  .btn-mini { padding: 5px 12px; border: 1px solid #d1d5db; background: #fff;
              border-radius: 6px; font-size: 12px; cursor: pointer; margin-right: 4px; }
  .btn-mini:hover { background: #f3f4f6; }
  .btn-primary { background: #2563eb; color: #fff; border-color: #2563eb; }
  .btn-primary:hover { background: #1d4ed8; }
  .btn-danger { color: #dc2626; border-color: #fca5a5; }
  h2 button { float: right; }
  /* Tab 导航 */
  .tabs { display: flex; gap: 4px; margin-bottom: 20px; background: #fff;
          border-radius: 10px; padding: 6px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .tab { flex: 0 0 auto; padding: 9px 22px; border-radius: 7px; font-size: 14px;
         color: #6b7280; cursor: pointer; user-select: none; text-align: center; }
  .tab:hover { color: #2563eb; }
  .tab.active { background: #2563eb; color: #fff; font-weight: 600; }
</style>
</head>
<body>

<!-- 登录视图 -->
<div id="login-view">
  <div class="login-box">
    <h2>aiChatBot 管理后台</h2>
    <div id="err"></div>
    <input id="username" placeholder="用户名" autocomplete="username">
    <input id="password" type="password" placeholder="密码" autocomplete="current-password">
    <button onclick="doLogin()">登 录</button>
  </div>
</div>

<!-- 主视图 -->
<div id="main-view" class="hidden">
  <header>
    <h1>aiChatBot 管理后台</h1>
    <button onclick="logout()">退出登录</button>
  </header>
  <main>
    <div class="tabs">
      <div class="tab active" data-tab="stats" onclick="switchTab('stats')">📊 统计</div>
      <div class="tab" data-tab="users" onclick="switchTab('users')">👥 用户</div>
      <div class="tab" data-tab="roles" onclick="switchTab('roles')">🎭 角色人设</div>
    </div>

    <!-- Tab：统计概览 -->
    <div class="tab-panel" id="panel-stats">
      <div class="cards">
        <div class="card"><div class="num" id="st-users">-</div><div class="label">用户总数</div></div>
        <div class="card"><div class="num" id="st-msgs">-</div><div class="label">消息总数</div></div>
        <div class="card"><div class="num" id="st-today">-</div><div class="label">今日消息</div></div>
      </div>
      <section>
        <h2>模型用量（assistant 消息数）</h2>
        <table><thead><tr><th>模型</th><th>消息数</th></tr></thead>
          <tbody id="model-rows"></tbody></table>
      </section>
    </div>

    <!-- Tab：用户管理 -->
    <div class="tab-panel hidden" id="panel-users">
      <section>
        <h2>用户列表
          <button class="btn-mini" onclick="loadData(true)">刷新</button>
        </h2>
        <table>
          <thead><tr><th>Telegram ID</th><th>用户名</th><th>显示名</th><th>偏好模型</th><th>消息数</th><th>最近活跃</th></tr></thead>
          <tbody id="user-rows"></tbody>
        </table>
      </section>
    </div>

    <!-- Tab：角色人设 -->
    <div class="tab-panel hidden" id="panel-roles">
      <section>
        <h2>角色人设
          <button class="btn-mini" onclick="editRole()">+ 新增人设</button>
        </h2>
        <div id="role-form" class="hidden" style="margin-bottom:14px;">
          <input id="role-name" placeholder="角色名（如：赛博诗人）" style="width:220px;">
          <input id="role-desc" placeholder="一句话描述（列表展示用）" style="width:340px;">
          <textarea id="role-prompt" rows="4" placeholder="人设 system prompt"
                    style="width:100%;margin-top:8px;padding:8px;border:1px solid #d1d5db;border-radius:6px;font-size:13px;"></textarea>
          <div style="margin-top:8px;">
            <button class="btn-mini btn-primary" onclick="saveRole()">保存</button>
            <button class="btn-mini" onclick="cancelEditRole()">取消</button>
            <span id="role-msg" style="font-size:12px;color:#6b7280;margin-left:8px;"></span>
          </div>
        </div>
        <table>
          <thead><tr><th>角色名</th><th>描述</th><th style="width:130px;">操作</th></tr></thead>
          <tbody id="role-rows"></tbody>
        </table>
      </section>
    </div>
  </main>
</div>

<script>
const TOKEN_KEY = 'admin_token';
const api = (path) => fetch('/api' + path, { headers: { Authorization: 'Bearer ' + localStorage.getItem(TOKEN_KEY) } });

async function doLogin() {
  const err = document.getElementById('err');
  err.textContent = '';
  const resp = await fetch('/api/login', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      username: document.getElementById('username').value,
      password: document.getElementById('password').value,
    }),
  });
  if (!resp.ok) { err.textContent = (await resp.json()).detail || '登录失败'; return; }
  localStorage.setItem(TOKEN_KEY, (await resp.json()).token);
  showMain();
}

function logout() { localStorage.removeItem(TOKEN_KEY); location.reload(); }

function esc(s) { const d = document.createElement('div'); d.textContent = s == null ? '' : String(s); return d.innerHTML; }

async function loadData(force) {
  const statsResp = await api('/stats');
  if (statsResp.status === 401) { logout(); return; }
  const stats = await statsResp.json();
  document.getElementById('st-users').textContent = stats.total_users;
  document.getElementById('st-msgs').textContent = stats.total_messages;
  document.getElementById('st-today').textContent = stats.today_messages;
  document.getElementById('model-rows').innerHTML =
    Object.entries(stats.messages_by_model).map(([m, c]) => `<tr><td>${esc(m)}</td><td>${c}</td></tr>`).join('');

  const users = await (await api('/users')).json();
  document.getElementById('user-rows').innerHTML = users.map(u => `
    <tr><td>${u.telegram_id}</td><td>${esc(u.username ? '@' + u.username : '-')}</td>
    <td>${esc(u.first_name)}</td><td>${esc(u.preferred_model || '默认')}</td>
    <td>${u.message_count}</td><td>${esc(u.last_active || '-')}</td></tr>`).join('');
}

// ---------- Tab 切换（各 Tab 数据按需加载） ----------

const tabLoaders = {
  stats: () => loadData(),
  users: () => loadData(),
  roles: () => loadRoleList(),
};

function switchTab(name) {
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === name));
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.add('hidden'));
  document.getElementById('panel-' + name).classList.remove('hidden');
  if (tabLoaders[name]) tabLoaders[name]();
}

// ---------- 角色人设管理 ----------

async function loadRoleList() {
  const resp = await api('/roles');
  if (resp.status === 401) { logout(); return; }
  const roles = await resp.json();
  document.getElementById('role-rows').innerHTML = roles.map(r => `
    <tr><td><b>${esc(r.name)}</b></td><td>${esc(r.description)}</td>
    <td>
      <button class="btn-mini" onclick='editRole(${JSON.stringify(r.name)})'>编辑</button>
      <button class="btn-mini btn-danger" onclick='deleteRole(${JSON.stringify(r.name)})'>删除</button>
    </td></tr>`).join('');
}

let editingRole = null;  // 当前编辑中的角色名（null 表示新增）

async function editRole(name) {
  editingRole = name || null;
  document.getElementById('role-form').classList.remove('hidden');
  document.getElementById('role-msg').textContent = '';
  if (name) {
    const roles = await (await api('/roles')).json();
    const role = roles.find(r => r.name === name);
    document.getElementById('role-name').value = name;
    document.getElementById('role-desc').value = role ? role.description : '';
    document.getElementById('role-prompt').value = role ? role.prompt : '';
  } else {
    document.getElementById('role-name').value = '';
    document.getElementById('role-desc').value = '';
    document.getElementById('role-prompt').value = '';
  }
}

function cancelEditRole() { document.getElementById('role-form').classList.add('hidden'); }

async function saveRole() {
  const msg = document.getElementById('role-msg');
  const body = {
    name: document.getElementById('role-name').value.trim(),
    description: document.getElementById('role-desc').value.trim(),
    prompt: document.getElementById('role-prompt').value.trim(),
  };
  if (!body.name || !body.prompt) { msg.textContent = '角色名与 prompt 不能为空'; return; }
  // 编辑时改名：先删旧建新
  if (editingRole && editingRole !== body.name) await deleteRoleSilently(editingRole);
  const resp = await fetch('/api/roles', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + localStorage.getItem(TOKEN_KEY) },
    body: JSON.stringify(body),
  });
  msg.textContent = resp.ok ? '已保存，即时生效' : ((await resp.json()).detail || '保存失败');
  if (resp.ok) { cancelEditRole(); loadRoleList(); }
}

async function deleteRole(name) {
  if (!confirm(`确定删除人设「${name}」？使用该人设的用户将回退为默认助手。`)) return;
  await deleteRoleSilently(name);
  loadRoleList();
}

async function deleteRoleSilently(name) {
  await fetch('/api/roles/' + encodeURIComponent(name), {
    method: 'DELETE', headers: { Authorization: 'Bearer ' + localStorage.getItem(TOKEN_KEY) },
  });
}

function showMain() {
  document.getElementById('login-view').classList.add('hidden');
  document.getElementById('main-view').classList.remove('hidden');
  switchTab('stats');  // 默认进入统计页
}

// 已有令牌则直接进入主视图
if (localStorage.getItem(TOKEN_KEY)) showMain();
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !document.getElementById('login-view').classList.contains('hidden')) doLogin();
});
</script>
</body>
</html>
